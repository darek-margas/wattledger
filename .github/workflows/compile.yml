name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Accumulator
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I components/wattledger \
            tests/host/test_accumulator.cpp components/wattledger/accumulator.cpp \
            -o test_accumulator
          ./test_accumulator
      - name: Sealing
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I components/wattledger \
            tests/host/test_sealing.cpp components/wattledger/sealing.cpp components/wattledger/records.cpp \
            components/wattledger/journal.cpp -o test_sealing
          ./test_sealing
      - name: Journal
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I components/wattledger \
            tests/host/test_journal.cpp components/wattledger/journal.cpp components/wattledger/records.cpp \
            -o test_journal
          ./test_journal
      - name: Timeline
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I components/wattledger \
            tests/host/test_timeline.cpp components/wattledger/timeline.cpp -o test_timeline
          ./test_timeline
      - name: PVOutput statuses
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I components/wattledger \
            tests/host/test_pvoutput.cpp components/wattledger/pvoutput_status.cpp \
            components/wattledger/timeline.cpp -o test_pvoutput
          ./test_pvoutput

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: pytest tests/integration -q
      - name: Compile all integration modules
        run: python -m compileall -q custom_components/wattledger

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [vue3-grid, vue3-generator]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install esphome
      - name: Create secrets
        run: |
          sed "s|^api_encryption_key:.*|api_encryption_key: \"$(openssl rand -base64 32)\"|" \
            examples/secrets.yaml.example > examples/secrets.yaml
      - run: esphome compile examples/${{ matrix.example }}.yaml
