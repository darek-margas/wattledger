# Grid Vue: mains, solar inverter and grid-only circuits.
# Measures against the grid supply; uploads to PVOutput (from milestone 5).

substitutions:
  name: vue-grid
  friendly_name: Vue Grid
  timezone: UTC  # set your zone, e.g. Australia/Sydney
  ntp_server_1: 192.168.1.1  # pfSense
  ntp_server_2: 192.168.1.2  # second internal NTP server
  ntp_server_3: pool.ntp.org

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended

external_components:
  - source:
      type: git
      url: https://github.com/rosenrot00/emporiavue.git
      ref: 2026.10.4  # pinned driver release; update deliberately
    components: [emporiavue]
  - source:
      type: local
      path: ../components
    components: [rv3028, wattledger]

packages:
  emporiavue:
    url: https://github.com/rosenrot00/emporiavue.git
    ref: 2026.10.4
    files:
      - packages/vue3-i2c.yaml
      - packages/vue3-1phase.yaml
      - packages/vue3-gpios.yaml
  wattledger: !include ../packages/vue3-wattledger.yaml
  # This unit has the optional RV-3028 RTC fitted.
  wattledger_rtc: !include ../packages/vue3-rtc.yaml

# Wired Ethernet is preferred, but the Vue 3's PHY type and pins aren't
# confirmed yet (design open question 2). Wi-Fi until then.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Keep running without Wi-Fi; the journal covers the outage.
  reboot_timeout: 0s

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password
    allow_partition_access: true
    on_begin:
      then:
        - lambda: global_preferences->sync();

logger:
  logs:
    sensor: INFO

preferences:
  # Avoid periodic flash writes; preferences are saved at controlled points.
  flash_write_interval: never

emporiavue:
  filter_defaults:
    power:
      - throttle_average: 5s
    energy:
      - throttle: 60s

  # line_1 (BLACK) is the grid active. Every CT on this Vue uses line 1.
  circuits:
    cir1:
      name: "Solar inverter"
      line: 1
      power:
      energy:
    cir2:
      name: "Hot water"
      line: 1
      power:
      energy:

  groups:
    grid:
      power:

sensor:
  # Prices in currency per kWh from Home Assistant; use your tariff's entities.
  - platform: homeassistant
    id: import_price
    entity_id: sensor.electricity_import_price
    internal: true
  - platform: homeassistant
    id: export_price
    entity_id: sensor.electricity_export_price
    internal: true

wattledger:
  time_id: sntp_time
  # Inputs are the driver's unfiltered power sensors: mains `line_1_power`,
  # circuits `cir1`...`cir16`. Consuming loads read positive, so the inverter's
  # circuit reads negative while generating.
  inputs:
    - id: mains
      sensor: line_1_power
    - id: solar
      sensor: cir1
    - id: hws
      sensor: cir2
  lines:
    - id: line_1
      sensor: line_1_voltage
  outputs:
    - id: grid
      # Positive import, negative export; split into import and export energy.
      lambda: return mains;
      power:
        # "Grid Power" is the driver's grid group sensor.
        name: "Grid net power"
      import_energy:
        name: "Grid import"
      export_energy:
        name: "Grid export"
    - id: generation
      # The inverter draws ~0.5 A at PF ~0 overnight; ignore anything under 15 W.
      lambda: |-
        return solar < -15.0f ? -solar : 0.0f;
      power:
        name: "Solar generation power"
      import_energy:
        name: "Solar generation"
    - id: consumption
      lambda: |-
        return mains + (solar < -15.0f ? -solar : 0.0f);
      power:
        name: "Consumption power"
      import_energy:
        name: "Consumption"
  # Cost of grid import and credit for export, from Home Assistant prices.
  cost:
    output: grid
    import_price: import_price
    export_price: export_price
    daily_supply_charge: 1.10
    # Used while Home Assistant is unavailable.
    fallback_schedule:
      - {from: "00:00", to: "15:00", import: 0.28, export: 0.05}
      - {from: "15:00", to: "21:00", import: 0.45, export: 0.05}
      - {from: "21:00", to: "24:00", import: 0.28, export: 0.05}
    cost_today:
      name: "Electricity cost today"
      unit_of_measurement: AUD
    credit_today:
      name: "Electricity credit today"
      unit_of_measurement: AUD
  # Direct upload to PVOutput: generation and consumption every 5 minutes.
  pvoutput:
    api_key: !secret pvoutput_api_key
    system_id: !secret pvoutput_system_id
    donor: false
    generation: generation
    consumption: consumption
    voltage: line_1
    backlog:
      name: "PVOutput backlog"
    rate_limit_remaining:
      name: "PVOutput requests left"
    last_upload:
      name: "PVOutput last upload"
    replay_progress:
      name: "PVOutput replay progress"
    last_error:
      name: "PVOutput status"
    replay:
      name: "PVOutput replay"
