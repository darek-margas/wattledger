# Wired Ethernet for an Emporia Vue 3, alongside Wi-Fi, plus the status LEDs.
#
# Include next to the node's own `wifi:` block. Both interfaces stay up;
# traffic uses Ethernet while it has a link and Wi-Fi otherwise. Adding this
# changes only the app, so it can be installed over OTA.
#
# The Vue 3 has an RTL8201F PHY (U18) on the ESP32's RMII pins, with MDC on
# GPIO32, MDIO on GPIO33 and the 50 MHz reference clock coming in on GPIO0.
# The same settings are in the emporia-vue-local base config and in a working
# Vue 3 setup on the Home Assistant forum.

network:
  priority:
    - ethernet
    - wifi

ethernet:
  type: RTL8201
  mdc_pin: GPIO32
  mdio_pin: GPIO33
  clk:
    pin: GPIO0
    mode: CLK_EXT_IN

# Status LEDs: GPIO2 for Wi-Fi, GPIO4 for Ethernet. Each is on while its
# interface is connected; both blink while neither is. This replaces the
# driver's packages/vue3-gpios.yaml, which only ever lights the Wi-Fi LED when
# Wi-Fi is compiled in. Don't include both: they drive the same pins.
output:
  - platform: gpio
    id: vue3_wifi_led
    pin:
      number: GPIO2
      ignore_strapping_warning: true
  - platform: gpio
    id: vue3_ethernet_led
    pin: GPIO4

interval:
  - interval: 250ms
    then:
      - lambda: |-
          static bool blink = false;
          blink = !blink;
          const bool eth = esphome::ethernet::global_eth_component != nullptr &&
                           esphome::ethernet::global_eth_component->is_connected();
          const bool wifi = esphome::wifi::global_wifi_component != nullptr &&
                            esphome::wifi::global_wifi_component->is_connected();
          const bool none = !eth && !wifi;
          id(vue3_ethernet_led).set_state(eth || (none && blink));
          id(vue3_wifi_led).set_state(wifi || (none && blink));
