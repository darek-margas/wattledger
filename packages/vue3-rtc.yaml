# Optional RV-3028 RTC for an Emporia Vue 3, on top of vue3-wattledger.yaml.
#
# Only for units with a PiicoDev RV-3028 board (Core Electronics) soldered
# inside (see README). Requires the `rv3028` external component from this
# repository.
#
# Sets the system clock at boot, before the network is up, if the RTC's time
# is valid, and stores the time after every SNTP sync.

time:
  # On the Vue 3's I2C bus, shared with the SAMD09 (0x64); the RV-3028 is 0x52.
  - platform: rv3028
    id: rtc_time
    timezone: ${timezone}
    write_from: sntp_time
